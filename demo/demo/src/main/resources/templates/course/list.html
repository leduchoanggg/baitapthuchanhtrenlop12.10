<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Quản lý Khóa học</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="container mt-4">
    <h2 class="mb-4 text-primary">Danh sách Khóa học</h2>

    <!-- Form tìm kiếm và lọc -->
    <form method="get" th:action="@{/courses}" class="row g-3 mb-4 p-3 bg-light border rounded">
        <div class="col-md-3">
            <label class="form-label">Từ khóa tên:</label>
            <input type="text" name="keyword" th:value="${keyword}" class="form-control" placeholder="Nhập tên khóa học...">
        </div>
        <div class="col-md-2">
            <label class="form-label">Loại khóa học:</label>
            <select name="categoryId" class="form-select">
                <option value="">-- Tất cả --</option>
                <option th:each="cat : ${categories}" th:value="${cat.id}" th:text="${cat.name}" th:selected="${cat.id == categoryId}"></option>
            </select>
        </div>
        <div class="col-md-2">
            <label class="form-label">Trạng thái:</label>
            <select name="isActive" class="form-select">
                <option value="">-- Tất cả --</option>
                <option value="true" th:selected="${isActive == true}">Đang hoạt động</option>
                <option value="false" th:selected="${isActive == false}">Ngừng tuyển sinh</option>
            </select>
        </div>
        <div class="col-md-2">
            <label class="form-label">Sắp xếp:</label>
            <select name="sortField" class="form-select">
                <option value="">Mặc định</option>
                <option value="fee_asc" th:selected="${sortField == 'fee_asc'}">Học phí tăng dần</option>
                <option value="fee_desc" th:selected="${sortField == 'fee_desc'}">Học phí giảm dần</option>
                <option value="duration_asc" th:selected="${sortField == 'duration_asc'}">Thời lượng tăng dần</option>
            </select>
        </div>
        <div class="col-md-3 d-flex align-items-end">
            <button type="submit" class="btn btn-primary w-100">Tìm kiếm & Lọc</button>
        </div>
    </form>

    <!-- Bảng danh sách khóa học -->
    <table class="table table-bordered table-striped align-middle">
        <thead class="table-dark">
            <tr>
                <th>ID</th>
                <th>Tên Khóa Học</th>
                <th>Học Phí (VNĐ)</th>
                <th>Thời Lượng (Giờ)</th>
                <th>Phân Loại</th>
                <th>Trạng Thái</th>
                <th>Thao Tác</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="c : ${courses}">
                <td th:text="${c.id}"></td>
                <td th:text="${c.name}"></td>
                <td th:text="${#numbers.formatDecimal(c.tuitionFee, 0, 'COMMA', 0, 'POINT')}"></td>
                <td th:text="${c.duration}"></td>
                <td>
                    <span class="badge bg-info" th:text="${c.durationType}"></span>
                </td>
                <td>
                    <span th:if="${c.isActive}" class="badge bg-success">Đang hoạt động</span>
                    <span th:unless="${c.isActive}" class="badge bg-secondary">Ngừng tuyển sinh</span>
                </td>
                <td>
                    <a th:href="@{/courses/{id}(id=${c.id})}" class="btn btn-sm btn-info text-white">Chi tiết / Ảnh</a>
                </td>
            </tr>
            <tr th:if="${#lists.isEmpty(courses)}">
                <td colspan="7" class="text-center text-muted">Không tìm thấy khóa học nào phù hợp.</td>
            </tr>
        </tbody>
    </table>

    <!-- Bảng danh sách loại khóa học kèm ràng buộc xóa -->
    <h3 class="mt-5 mb-3 text-secondary">Quản lý Loại Khóa Học</h3>
    <table class="table table-bordered align-middle">
        <thead class="table-secondary">
            <tr>
                <th>ID</th>
                <th>Tên Loại</th>
                <th>Mô Tả</th>
                <th>Thao Tác</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="cat : ${categories}">
                <td th:text="${cat.id}"></td>
                <td th:text="${cat.name}"></td>
                <td th:text="${cat.description}"></td>
                <td>
                    <a th:href="@{/courses/categories/delete/{id}(id=${cat.id})}" class="btn btn-sm btn-danger" onclick="return confirm('Bạn có chắc muốn xóa loại khóa học này không?')">Xóa</a>
                </td>
            </tr>
        </tbody>
    </table>
</body>
</html>
